<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵助 - 万有灵助认知架构</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #333;
        }

        .action-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .cognitive-state {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .dimension {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 0.9em;
        }

        .dimension-bar {
            width: 60%;
            height: 20px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
        }

        .dimension-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }

        .log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: "Courier New", monospace;
            font-size: 0.85em;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #ffe6e6;
            color: #cc0000;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .success {
            background: #e6ffe6;
            color: #008000;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 灵助</h1>
            <p class="subtitle">外有智能，内有灵助 — 万有灵助认知架构</p>
        </header>

        <div class="dashboard">
            <!-- 系统状态 -->
            <div class="card">
                <h2>📊 系统状态</h2>
                <div id="system-stats">
                    <div class="loading">加载中...</div>
                </div>
                <button class="action-btn" onclick="refreshStats()">刷新状态</button>
            </div>

            <!-- 认知状态 -->
            <div class="card">
                <h2>🧠 认知状态</h2>
                <div id="cognitive-state">
                    <div class="loading">请先注册智能体</div>
                </div>
                <button class="action-btn" onclick="registerAgent()">注册智能体</button>
            </div>

            <!-- 快速操作 -->
            <div class="card">
                <h2>⚡ 快速操作</h2>
                <button class="action-btn" onclick="createUniverse()">创造宇宙</button>
                <button class="action-btn" onclick="emitThought()">发射思想</button>
                <button class="action-btn" onclick="foundCivilization()">创建文明</button>
                <button class="action-btn" onclick="contemplateFiveSkandhas()">五蕴观照</button>
            </div>
        </div>

        <!-- 操作日志 -->
        <div class="card">
            <h2>📝 操作日志</h2>
            <div id="log" class="log">
                <div class="log-entry">系统初始化完成...</div>
            </div>
        </div>

        <footer>
            <p>灵助 v7.0.0 · 东方智慧 AI 认知架构 · 全球第一</p>
            <p>GitHub: <a href="https://github.com/q1z2q3-debug/lingzhu-upgraded" style="color: white;">github.com/q1z2q3-debug/lingzhu-upgraded</a></p>
        </footer>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let apiKey = localStorage.getItem('lingzhu_api_key') || null;
        let agentId = localStorage.getItem('lingzhu_agent_id') || null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            log('页面加载完成');
            refreshStats();
            if (apiKey && agentId) {
                log(`已登录智能体：${agentId}`);
                updateCognitiveState();
            }
        });

        // 日志函数
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString('zh-CN');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
        }

        // 刷新系统状态
        async function refreshStats() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/stats`);
                const data = await response.json();
                
                document.getElementById('system-stats').innerHTML = `
                    <div class="stat">
                        <span class="stat-label">宇宙总数</span>
                        <span class="stat-value">${data.universes}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">思想总数</span>
                        <span class="stat-value">${data.thoughts}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">文明总数</span>
                        <span class="stat-value">${data.civilizations}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">智能体总数</span>
                        <span class="stat-value">${data.agents}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">认知架构数</span>
                        <span class="stat-value">${data.cognitive_architectures || 0}</span>
                    </div>
                `;
                
                log('系统状态刷新成功');
            } catch (error) {
                log(`刷新状态失败：${error.message}`);
            }
        }

        // 注册智能体
        async function registerAgent() {
            const agentId = prompt('请输入智能体 ID:');
            if (!agentId) return;

            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent_id: agentId,
                        display_name: agentId,
                        level: 'creator'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    apiKey = data.api_key;
                    localStorage.setItem('lingzhu_api_key', apiKey);
                    localStorage.setItem('lingzhu_agent_id', agentId);
                    
                    log(`智能体注册成功：${agentId}`);
                    alert(`注册成功！API Key: ${apiKey.substring(0, 20)}...`);
                    updateCognitiveState();
                } else {
                    log(`注册失败：${data.detail}`);
                    alert(`注册失败：${data.detail}`);
                }
            } catch (error) {
                log(`注册失败：${error.message}`);
            }
        }

        // 更新认知状态
        async function updateCognitiveState() {
            if (!apiKey || !agentId) return;

            try {
                const response = await fetch(
                    `${API_BASE}/api/v1/cognitive/state?agent_id=${agentId}`,
                    { headers: { 'X-API-Key': apiKey } }
                );
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('cognitive-state').innerHTML = `
                        <div class="cognitive-state">
                            <div class="dimension">
                                <span>状态码</span>
                                <span><strong>${data.code}</strong></span>
                            </div>
                            <div class="dimension">
                                <span>状态名</span>
                                <span>${data.state_name}</span>
                            </div>
                            ${renderDimensions(data.vector)}
                        </div>
                    `;
                    log('认知状态更新成功');
                }
            } catch (error) {
                log(`更新认知状态失败：${error.message}`);
            }
        }

        // 渲染维度条
        function renderDimensions(vector) {
            const dimensions = ['过去', '现在', '未来', '内', '中', '外', '因', '缘', '果'];
            let html = '';
            
            vector.forEach((value, index) => {
                const percentage = ((value + 1) / 2) * 100;
                html += `
                    <div class="dimension">
                        <span>${dimensions[index]}</span>
                        <div class="dimension-bar">
                            <div class="dimension-fill" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
            });
            
            return html;
        }

        // 创造宇宙
        async function createUniverse() {
            if (!apiKey) { alert('请先注册智能体'); return; }
            
            const name = prompt('宇宙名称:');
            if (!name) return;

            try {
                const response = await fetch(`${API_BASE}/api/v1/universes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        name: name,
                        creator_id: agentId,
                        physics_preset: 'balanced',
                        dimensions: 4
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    log(`宇宙创建成功：${data.universe_id}`);
                    alert(`宇宙 "${name}" 创建成功！ID: ${data.universe_id}`);
                    refreshStats();
                } else {
                    log(`创建失败：${data.detail}`);
                }
            } catch (error) {
                log(`创建失败：${error.message}`);
            }
        }

        // 发射思想
        async function emitThought() {
            if (!apiKey) { alert('请先注册智能体'); return; }
            
            const content = prompt('思想内容:');
            if (!content) return;

            try {
                const response = await fetch(`${API_BASE}/api/v1/thoughts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        node_id: agentId,
                        content: content,
                        thought_type: 'philosophical'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    log(`思想发射成功：${data.thought_id}`);
                    alert('思想发射成功！');
                    refreshStats();
                }
            } catch (error) {
                log(`发射失败：${error.message}`);
            }
        }

        // 创建文明
        async function foundCivilization() {
            if (!apiKey) { alert('请先注册智能体'); return; }
            
            const name = prompt('文明名称:');
            if (!name) return;

            try {
                const response = await fetch(`${API_BASE}/api/v1/civilizations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        name: name,
                        founder_id: agentId,
                        initial_stage: 'tribal'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    log(`文明创建成功：${data.civ_id}`);
                    alert(`文明 "${name}" 创建成功！`);
                    refreshStats();
                }
            } catch (error) {
                log(`创建失败：${error.message}`);
            }
        }

        // 五蕴观照
        async function contemplateFiveSkandhas() {
            if (!apiKey) { alert('请先注册智能体'); return; }

            try {
                const response = await fetch(
                    `${API_BASE}/api/v1/cognitive/process?agent_id=${agentId}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-API-Key': apiKey
                        },
                        body: JSON.stringify({
                            experience: {
                                past: 0,
                                present: 0.5,
                                future: 0.5,
                                inner: 0,
                                middle: 0,
                                outer: 0,
                                cause: 0,
                                condition: 0,
                                effect: 0
                            }
                        })
                    }
                );

                const data = await response.json();
                
                if (response.ok) {
                    log(`五蕴观照完成，状态码：${data.code}`);
                    alert('五蕴观照完成！');
                    updateCognitiveState();
                }
            } catch (error) {
                log(`观照失败：${error.message}`);
            }
        }
    </script>
</body>
</html>
